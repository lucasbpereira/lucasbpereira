
<div class="logo-box" #logoPrincipal>
  <img [src]="image" alt="Imagem do Rio de Janeiro">
  <div class="left-box">
    <span class="hello">Hello world! I'm</span>
    <h1 #myName class="myName">Lucas Barbosa Pereira</h1>
    <span class="myAge">{{age()}}yo</span>
  </div>
  <div class="right-box">
    <span class="hello">Mid-level</span>
    <h1 class="myJob">Software Engineer</h1>
    <span class="myAge">at Mestra Informática, Rio de Janeiro</span>
  </div>
  <div class="mask-overlay">
    <h1 class="logo">{{logo}}</h1>

   <div class="carousel-wrapper">

      <div class="carousel-track">

        @for (item of items; track $index) {
          <div class="container carousel-slide">
            <div class="box-text">
              <div class="title">
                <h2>{{ item.preTitle }}</h2>
                <h2 class="highlight">{{ item.highlight }}</h2>
                <h2>{{ item.postTitle }}</h2>
              </div>
              <p class="subtitle">{{ item.description }}</p>
            </div>
            <div class="box-image">
              <img [src]="item.image" [alt]="item.alt">
            </div>
          </div>
        }

      </div>

      <div class="controls">
        <button (click)="prevSlide()" [disabled]="currentSlideIndex() === 0" class="nav-btn prev">
            <svg [ngxiIconoir]="iconoirArrowLeft" color="#fff"></svg>
        </button>

        <button (click)="nextSlide()" [disabled]="currentSlideIndex() === items.length - 1" class="nav-btn next">
          <svg [ngxiIconoir]="iconoirArrowRight" color="#fff"></svg>
        </button>
      </div>

    </div>

    <div class="fog"></div>
  </div>
</div>



<section #about>
  sobre
</section>
